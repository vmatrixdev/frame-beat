name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  python-test:
    name: Python Engine Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System FFmpeg & Audio Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install System FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg || true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "engine/requirements-dev.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements-dev.txt
          pip install -e ./engine

      - name: Run Pytest Test Suite
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Test Sidecar Packaging Script
        run: |
          chmod +x scripts/bundle_sidecar.sh
          ./scripts/bundle_sidecar.sh

      - name: Run End-to-End Autonomous Demo Pipeline
        run: |
          PYTHONPATH=. python scripts/demo_pipeline.py

  frontend-test:
    name: Desktop UI Tests & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["20.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install NPM Dependencies
        working-directory: app
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: app
        run: npm test

      - name: Run Vite Production Build
        working-directory: app
        run: npm run build
